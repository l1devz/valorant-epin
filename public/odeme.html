<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ödeme | VPMarket</title>
  <link rel="icon" href="img/vp-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><polygon points="16,1 30,13 16,31 2,13" fill="#ff4655"/><polygon points="16,1 30,13 16,15" fill="#fff" opacity=".3"/><polygon points="16,9 22,14 16,22 10,14" fill="none" stroke="#fff" stroke-width="1.6"/></svg>
        <span>VP<b>Market</b></span>
      </a>
      <span class="secure-badge"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Güvenli Ödeme</span>
    </div>
  </header>

  <main class="container page-main">
    <div class="pay-wrap">
      <section class="pay-panel" id="payPanel">
        <div class="pay-loading" id="payLoading"><div class="spinner"></div><p>Ödeme sayfası hazırlanıyor…</p></div>
      </section>
      <aside class="co-summary" id="summary" hidden>
        <h4>Sipariş Özeti</h4>
        <p class="muted small">Sipariş No: <b id="oid"></b></p>
        <div id="items"></div>
        <div class="sum-row total"><span>Toplam</span><strong id="total"></strong></div>
      </aside>
    </div>
  </main>

  <script src="odeme.js"></script>
</body>
</html>
